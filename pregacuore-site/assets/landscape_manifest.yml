# ==============================================================================
# Pregacuore - landscape_manifest.yml v3.1
# ==============================================================================
#
# Catalogo sfondi per le card "frase del giorno" (social/Make e card in-app).
# DUE fonti, distinte dal campo file di ogni entry:
#   - local_file:    immagini HOUSE generate da noi (gia tonalizzate oro/bordeaux)
#                    -> NIENTE velo bordeaux in fase di render
#   - wikimedia_file: quadri PD (artisti morti da oltre 70 anni)
#                    -> desaturazione + velo bordeaux come prima
#
# NOVITA v3.1 (09/06/2026):
#   - aggiunto blocco `card_layout` = stile unico della card (cornice, data in
#     alto, logo in basso, font Cormorant). Lo leggono SIA card_generator.py
#     (social) SIA share-card.ts (in-app), cosi la card e identica ovunque.
#   - aggiunte 16 immagini HOUSE in /assets/immagini (cieli e paesaggi calmi).
#
# Flusso card_generator.py (invariato per i PD):
#   1. season liturgica del giorno (tabella liturgical_palette)
#   2. filtra landscapes con un mood compatibile con season.landscape_mood
#   3. sceglie deterministicamente: hash(content_date) % len(candidates)
#   4. render via `card_layout` (velo bordeaux SOLO se wikimedia_file)
#
# ==============================================================================

# ------------------------------------------------------------------------------
# CARD LAYOUT - stile unico della card (fonte di verita per ENTRAMBI i renderer)
# ------------------------------------------------------------------------------
card_layout:
  formats:
    post:      { w: 1080, h: 1080 }   # WhatsApp / feed (quadrato)
    story:     { w: 1080, h: 1920 }   # Storie / stato
    pinterest: { w: 1000, h: 1500 }   # social automatico

  font:
    family: "Cormorant Garamond"      # bundlare il .ttf nel generator
    verse_weight: 600                 # corsivo 600: leggibilita 55+
    date_weight: 500
    logo_weight: 600

  colors:
    verse_text:     "#F5EBD8"         # crema
    date_text:      "#D4A24A"         # oro
    bordeaux:       "#7B1F22"
    bordeaux_deep:  "#5A1419"
    gold_frame:     "#C9A24B"

  frame:                              # cornice sobria, come il concorrente
    enabled: true
    style: "thin double gold line with small corner ornaments"
    inset_pct: 4
    opacity: 0.55

  date:                               # IN ALTO, dentro la cornice
    position: top
    format: "D MMMM YYYY"             # "9 giugno 2026" (IT), NON 09/06
    locale: it
    align: center

  verse:                              # blocco versetto + riferimento
    position: center                  # centrato, gravita verso il terzo medio/basso
    max_width_pct: 80
    align: center
    reference_italic: true            # es. "Matteo 5,16" piu piccolo, corsivo
    scrim: true                       # velo scuro dietro il testo
    scrim_opacity: 0.28               # alzare se lo sfondo li e chiaro

  logo:                               # IN BASSO: marchio, NON l'url
    position: bottom
    type: "pittogramma cuore-candela + wordmark pregacuore"
    color: "#F5EBD8"
    opacity: 0.85
    height_pct: 7

  # Tonalizzazione SOLO ai PD. NB: valori DOCUMENTATIVI — i numeri vivi sono le
  # costanti PD_* in card_generator.py (tonalize_pd). Handoff "colore-luce" §2:
  # velo bordeaux OFF di default (era 0.35 → "rossore diffuso"), colore naturale
  # + gradazione calda leggera. Il velo si riaccende solo per i temi rossi.
  tonalization:                       # applicata SOLO ai PD (wikimedia_file)
    pd:    { desaturate: 0.08, bordeaux_veil_opacity: 0.0, warm_grade: 0.07 }
    house: { desaturate: 0.0,  bordeaux_veil_opacity: 0.0 }

