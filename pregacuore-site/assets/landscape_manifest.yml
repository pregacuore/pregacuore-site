# ==============================================================================
# Note operative v3.1
# ==============================================================================
#
# - 16 HOUSE (cieli e paesaggi calmi) + 35 PD = 51 sfondi.
# - HOUSE: gia tonalizzate -> il render NON applica velo bordeaux (vedi
#   card_layout.tonalization.house). I PD restano come prima (velo 0.35).
# - HOUSE sono QUADRATE 1254x1254:
#     * post 1080x1080  -> downscale, ok
#     * story 1080x1920 / pinterest 1000x1500 -> serve estensione verticale:
#       per ora "blurred-extend" (riempi sopra/sotto con lo sfondo sfocato);
#       in alternativa generare versioni verticali piu avanti. (DECISIONE PM)
# - La data va in formato italiano esteso ("9 giugno 2026"), non 09/06.
# - Il logo in basso e il PITTOGRAMMA + wordmark, non l'url pregacuore.it.
# - Stessa `card_layout` per card_generator.py (social) e share-card.ts (in-app).
#
# Per aggiungere un PD: vedi download_landscapes.py.
# ==============================================================================
