# ==============================================================================
# Pregacuore - landscape_manifest.yml v3.0
# ==============================================================================
#
# Catalogo dei paesaggi di pubblico dominio usati come sfondo per le card.
# Tutti i quadri elencati sono di artisti morti da oltre 95 anni, quindi
# in PD secondo la legge europea (Italia: morte + 70 anni; UE: morte + 70).
#
# Direzione visiva (definita il 14 maggio 2026):
#   - SI: serenita, fiducia, pittoricita
#   - SI: impressionisti (Monet, Renoir, Pissarro, Sisley)
#   - SI: post-impressionisti luminosi (Van Gogh paesaggi, mietitori, mandorli)
#   - SI: Hudson River School (Bierstadt, Church, Cole, Inness)
#   - SI: Aivazovsky mari calmi e luminosi
#   - SI: Hokusai / stampe giapponesi (carattere, sereno)
#   - SI: Constable, Corot, Turner luminosi
#   - LIMITATO: Friedrich/Grimshaw (romantici tedeschi) - mantenuti come
#     "riserva" con flag reserve: true, scelti solo in mancanza di alternative
#
# Il card_generator.py legge questo file e, per ogni card:
#   1. Determina la `season` liturgica del giorno via tabella liturgical_palette
#   2. Filtra i paesaggi con almeno un `mood` compatibile con season.landscape_mood
#   3. Esclude paesaggi con reserve:true se ci sono >= 3 candidati non-riserva
#   4. Sceglie uno deterministicamente: hash(content_date) % len(candidates)
#   5. Lo applica come sfondo desaturato con opacita da palette
#
# ==============================================================================

# Mood vocabulary (allineato a liturgical_palette.landscape_mood)
# ---------------------------------------------------------------
#   bare_tree, candle, contemplation, countryside, dawn, desert,
#   evening_quiet, fog, forest, forest_misty, golden_hour, light,
#   light_rays, meadow, meadow_flowers, misty, mountain, mountain_austere,
#   mountain_dawn, rocks, ruins, sea_calm, snow_calm, spring_bloom,
#   starry_night, sunrise, sunset_quiet, warm_interior, winter_quiet
#
# Ogni paesaggio ha 2-4 mood. Piu mood = piu polivalente = piu scelto.

