name: Pregacuore — Daily Content (Claude)

# Genera ogni giorno il contenuto + card per il giorno T+30, mantenendo ~30
# giorni di buffer in DB. Sostituisce il vecchio workflow "Daily Content"
# (Gemini, disattivato): qui pipeline.py usa CLAUDE per i contenuti redazionali,
# mentre il Vangelo/giorno liturgico/santo restano deterministici (lezionario).
#
# ⚠️ Richiede il secret ANTHROPIC_API_KEY nei Secrets del repo (Settings →
#    Secrets and variables → Actions). SUPABASE_URL/SERVICE_KEY già presenti.

on:
  schedule:
    # 04:00 UTC ogni giorno = 05:00/06:00 ora italiana (CET/CEST)
    - cron: '0 4 * * *'

  workflow_dispatch:
    inputs:
      target_mode:
        description: 'Modalita esecuzione'
        required: true
        default: 'ahead-30'
        type: choice
        options:
          - ahead-30
          - tomorrow
          - today

defaults:
  run:
    working-directory: pregacuore-site

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pregacuore-site/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera asset visuali (pittogrammi, papiro)
        run: |
          if [ -f setup_assets.py ]; then
            python setup_assets.py
          else
            echo "setup_assets.py non presente, skip."
          fi

      - name: Determina parametro data
        id: date_param
        run: |
          MODE="${{ github.event.inputs.target_mode || 'ahead-30' }}"
          case "$MODE" in
            ahead-30) echo "param=--ahead 30" >> $GITHUB_OUTPUT ;;
            tomorrow) echo "param=--tomorrow"  >> $GITHUB_OUTPUT ;;
            today)    echo "param="            >> $GITHUB_OUTPUT ;;
          esac

      - name: Genera pensiero del giorno (Claude + lezionario + Supabase)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline.py ${{ steps.date_param.outputs.param }}

      - name: Genera card Instagram (post + story)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python card_generator.py ${{ steps.date_param.outputs.param }}

      - name: Riepilogo
        if: always()
        run: |
          echo "Daily Content (Claude) completato — modalita: ${{ github.event.inputs.target_mode || 'ahead-30 (cron)' }}"
