name: Pregacuore — Backfill Content (range)

# Workflow ad esecuzione manuale per riempire il DB con un range di giorni
# in un colpo solo. Da usare ad esempio al primo deploy per popolare
# i 30 giorni successivi, o quando il cron giornaliero ha saltato giorni.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Data inizio (YYYY-MM-DD)'
        required: true
        type: string
      date_to:
        description: 'Data fine inclusa (YYYY-MM-DD)'
        required: true
        type: string
      skip_cards:
        description: 'Salta generazione card (solo testo)'
        required: false
        default: false
        type: boolean

# Tutti gli step "run" partono dentro la sottocartella del progetto Python.
defaults:
  run:
    working-directory: pregacuore-site

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 30 giorni * (~10s Gemini + 5s pausa) + card = molto sotto i 60 min
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pregacuore-site/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera asset visuali (pittogrammi, papiro)
        run: |
          if [ -f setup_assets.py ]; then
            python setup_assets.py
          else
            echo "setup_assets.py non presente, skip."
          fi

      - name: Backfill contenuti (pipeline.py)
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python pipeline.py \
            --from ${{ github.event.inputs.date_from }} \
            --to   ${{ github.event.inputs.date_to }}

      - name: Backfill card (card_generator.py)
        if: ${{ github.event.inputs.skip_cards != 'true' }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python card_generator.py \
            --from ${{ github.event.inputs.date_from }} \
            --to   ${{ github.event.inputs.date_to }}

      - name: Riepilogo
        if: always()
        run: |
          echo "Backfill completato:"
          echo "  da ${{ github.event.inputs.date_from }}"
          echo "  a  ${{ github.event.inputs.date_to }}"
          echo "  card: ${{ github.event.inputs.skip_cards == 'true' && 'saltate' || 'generate' }}"
