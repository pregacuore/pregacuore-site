name: Pregacuore — Daily Content

# Genera ogni giorno il contenuto + card per il giorno T+30,
# mantenendo sempre 30 giorni di buffer in DB.

on:
  schedule:
    # 04:00 UTC ogni giorno = 05:00/06:00 ora italiana (CET/CEST)
    # Orario notturno italiano per non gravare sul rate limit di mattina.
    - cron: '0 4 * * *'

  # Permette esecuzione manuale dal tab "Actions" su GitHub
  workflow_dispatch:
    inputs:
      target_mode:
        description: 'Modalita esecuzione'
        required: true
        default: 'ahead-30'
        type: choice
        options:
          - ahead-30
          - tomorrow
          - today

# Tutti gli step "run" partono dentro la sottocartella del progetto Python.
# I sorgenti stanno in pregacuore-site/ perche' Vercel ha quella come root.
defaults:
  run:
    working-directory: pregacuore-site

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          # Il path della cache e' relativo alla repo root, non a working-directory.
          cache-dependency-path: pregacuore-site/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera asset visuali (pittogrammi, papiro)
        run: |
          if [ -f setup_assets.py ]; then
            python setup_assets.py
          else
            echo "setup_assets.py non presente, skip."
          fi

      - name: Determina parametro data
        id: date_param
        run: |
          MODE="${{ github.event.inputs.target_mode || 'ahead-30' }}"
          case "$MODE" in
            ahead-30) echo "param=--ahead 30" >> $GITHUB_OUTPUT ;;
            tomorrow) echo "param=--tomorrow"  >> $GITHUB_OUTPUT ;;
            today)    echo "param="            >> $GITHUB_OUTPUT ;;
          esac

      - name: Genera pensiero del giorno (Gemini + Supabase)
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline.py ${{ steps.date_param.outputs.param }}

      # Card social STACCATE (15/08/2026, decisione PM): non si pubblicano piu' e
      # nessuno le leggeva — ne' l'app ne' i reel. Generarle costava tempo di CI e
      # riempiva lo storage. Per rifarle a mano resta il workflow Regenerate Cards.

      - name: Riepilogo
        if: always()
        run: |
          echo "Workflow completato per modalita: ${{ github.event.inputs.target_mode || 'ahead-30 (cron)' }}"
