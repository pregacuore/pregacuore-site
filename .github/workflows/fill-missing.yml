name: Pregacuore — Fill Missing (rete di sicurezza)

# Ripara i buchi di daily_content nella finestra-buffer (oggi..oggi+30):
# giorni senza contenuto o senza card (social_card_url) -> rigenera contenuto
# Luzzi e/o card. Gira 1h dopo la Daily Content, così cattura i giri falliti
# (es. 503 Gemini) prima che diventino buchi visibili all'utente e prima che
# Make fallisca la pubblicazione per 'image_url' mancante.

on:
  schedule:
    # 05:00 UTC ogni giorno (1h dopo daily-content alle 04:00).
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Ampiezza finestra in giorni'
        required: false
        default: '30'

concurrency:
  group: fill-missing
  cancel-in-progress: false

defaults:
  run:
    working-directory: pregacuore-site

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pregacuore-site/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera asset visuali (pittogrammi, papiro)
        run: |
          if [ -f setup_assets.py ]; then
            python setup_assets.py
          else
            echo "setup_assets.py non presente, skip."
          fi

      - name: Ripara i buchi (contenuto + card)
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fill_missing.py --days ${{ github.event.inputs.days || '30' }}

      # Email di allerta SOLO se qualcosa è fallito (un giorno non riparato:
      # es. crediti Gemini finiti). In aggiunta alla notifica GitHub. Richiede
      # i secret RESEND_API_KEY (già usato per le newsletter) e ALERT_EMAIL
      # (l'indirizzo a cui mandare l'avviso). Se mancano, salta senza errori.
      - name: Avvisa via email (solo su fallimento)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "Secret RESEND_API_KEY/ALERT_EMAIL mancanti: niente email."; exit 0
          fi
          BODY=$(python -c 'import json,os; print(json.dumps({"from":"Pregacuore <newsletter@pregacuore.it>","to":[os.environ["ALERT_EMAIL"]],"subject":"Pregacuore: generazione contenuto FALLITA","html":"Il workflow Fill Missing non e riuscito a riparare un giorno di daily_content (contenuto o card). Controlla i crediti Gemini e GitHub Actions.<br><br>Run: "+os.environ.get("RUN_URL","")}))')
          curl -s -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" --data "$BODY" && echo "" && echo "Email di allerta inviata a $ALERT_EMAIL."
